[project]
name = "equinix-dscodealong"
version = "0.1.0"
description = "Multi-agent RFP analysis system using LangGraph and OpenAI to extract requirements and map to Equinix solutions"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.1",
    "openai>=2.36.0",
    "pydantic>=2.13.4",
    "uvicorn>=0.46.0",
    "langgraph>=0.0.40",
    "pymupdf>=1.24.0",
    "python-multipart>=0.0.6",
    "dotenv>=0.9.9",
    "loguru>=0.7.3",
    "pymupdf4llm>=1.27.2.3",
]
